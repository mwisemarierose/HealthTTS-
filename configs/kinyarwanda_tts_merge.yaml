# Merge mbaza + AfriSpeak Female + AfriSpeak Male into one Kin training pool.
# No Pastor. Raw datasets are never overwritten.
#
# Split policy:
#   - AfriSpeak: keep official train + val(=dev). Official test_manifest has NO audio
#     on HF → carve a small held-out test from official train (see afrispeak_heldout_test).
#   - mbaza: create reproducible train/dev/test (no official split)
#   - Combined:
#       train = mbaza_train + AfriSpeak♂_train + AfriSpeak♀_train
#       dev   = mbaza_dev   + AfriSpeak♂_val   + AfriSpeak♀_val
#       test  = mbaza_test  + AfriSpeak♂_heldout_test + AfriSpeak♀_heldout_test

mbaza:
  data_root: /project/community/rmwisene/datasets/kinyarwanda_tts
  metadata: tts-dataset.csv
  audio_dir: audio
  speaker_id: mbaza_spk0
  source: mbaza_tts

afrispeak_female:
  data_root: /project/community/rmwisene/datasets/afrispeak_kinyarwanda_female
  hf_id: DigitalUmuganda/afrispeak_kinyarwanda_female_tts_dataset
  audio_dir: audio
  manifests:
    train: train_manifest.tsv
    dev: val_manifest.tsv
    # test_manifest.tsv exists but WAVs are not published — ignored when heldout enabled
  speaker_id: afrispeak_female
  source: afrispeak_female

afrispeak_male:
  data_root: /project/community/rmwisene/datasets/afrispeak_kinyarwanda_male
  hf_id: DigitalUmuganda/afrispeak_kinyarwanda_male_tts_dataset
  audio_dir: audio
  manifests:
    train: train_manifest.tsv
    dev: val_manifest.tsv
  speaker_id: afrispeak_male
  source: afrispeak_male

audio:
  sample_rate: 16000
  mono: true
  format: wav

cleaning:
  min_chars: 1
  max_chars: 2000
  min_duration_s: 0.3
  max_duration_s: 30.0
  normalize_unicode_nfc: true
  collapse_whitespace: true
  lowercase: false
  drop_empty_text: true
  drop_duplicate_text: false
  drop_duplicate_audio: true

# Only applied to mbaza
mbaza_split:
  seed: 42
  train_ratio: 0.90
  dev_ratio: 0.05
  test_ratio: 0.05

# AfriSpeak official test audio missing → hold out from official train.
# n matches published test_manifest sizes (18 ♀ / 100 ♂).
afrispeak_heldout_test:
  enabled: true
  seed: 42
  female_n: 18
  male_n: 100

review:
  n_samples_per_source: 50
  seed: 42

output:
  dir: /project/community/rmwisene/tts_data_cleaning/kinyarwanda_tts_mbaza_afrispeak
